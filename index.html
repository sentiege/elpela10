<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuentra al buen pelado</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef3ff;font-family:system-ui;overflow:hidden}header{height:88px;background:#192238;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(17px,3vw,25px);margin:0}p{font-size:12px;color:#bbc6dd;margin:6px 0}button{background:#33456a;border:1px solid #677ba1;color:white;border-radius:10px;padding:10px;cursor:pointer}canvas{display:block;width:100%;height:calc(100dvh - 88px);touch-action:none}#hud{position:fixed;top:100px;left:12px;background:#10182be8;padding:10px;border-radius:10px;font-size:13px;pointer-events:none}#notice{position:fixed;bottom:14px;right:12px;background:#10182be8;padding:10px;border-radius:10px;max-width:180px;font-size:12px;pointer-events:none}#pad{position:fixed;bottom:18px;left:16px;display:grid;grid-template:repeat(3,48px)/repeat(3,48px);gap:4px}#pad button{touch-action:none;font-size:24px;padding:0;background:#33456add;user-select:none}#over{position:fixed;inset:0;background:#050916d9;display:none;align-items:center;justify-content:center;padding:20px}#over.show{display:flex}article{background:#202b43;border:1px solid #5a709a;border-radius:20px;padding:24px;text-align:center;max-width:400px}article img{width:140px;height:140px;object-fit:cover;border-radius:14px}article p{font-size:15px;line-height:1.6}#title{font-size:24px}
</style><header><div><h1>🔍 Encuentra al buen pelado</h1><p>Encontrá al bueno antes de que el malo te atrape.</p></div><button id="restart">Nuevo mapa</button></header><canvas id="game"></canvas><div id="hud"></div><div id="notice">WASD o flechas para moverte.<br>🟨 Bueno: encontralo.<br>🟥 Malo: escapá de él.</div><div id="pad"><button style="grid-area:1/2" data-k="arrowup" aria-label="Arriba">↑</button><button style="grid-area:2/1" data-k="arrowleft" aria-label="Izquierda">←</button><button style="grid-area:3/2" data-k="arrowdown" aria-label="Abajo">↓</button><button style="grid-area:2/3" data-k="arrowright" aria-label="Derecha">→</button></div><div id="over" role="dialog" aria-modal="true"><article><img id="portrait" alt="Pelado"><h2 id="title"></h2><p id="result"></p><button id="again">Otra partida</button></article></div><script>
'use strict';
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),keys=new Set(),W=31,H=23,T=56,R=5;
const PLAYER_SPEED=190,ENEMY_SPEED=78;
let vw,vh,map,seen,vis,player,enemy,goal,waypoint=null,visited,total,ended,start,finish,last=performance.now(),cell='',missing=new Set();
function image(file,color){let im=new Image();im.onerror=()=>{missing.add(file);im.onerror=null;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="'+color+'"/><ellipse cx="50" cy="52" rx="31" ry="39" fill="#e1a477"/><circle cx="39" cy="49" r="4"/><circle cx="62" cy="49" r="4"/><path d="M36 70 Q50 78 65 70" fill="none" stroke="#592b22" stroke-width="4"/></svg>')};im.src=file;return im}
const good=image('peladobueno.jpg','#f6cc55'),bad=image('peladomalo.jpg','#e94354');
function resize(){vw=c.clientWidth;vh=c.clientHeight;let d=Math.min(devicePixelRatio||1,2);c.width=Math.round(vw*d);c.height=Math.round(vh*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
function open(x,y){return x>=0&&y>=0&&x<W&&y<H&&!map[y][x]}
function reset(){map=Array.from({length:H},()=>Array(W).fill(1));seen=Array.from({length:H},()=>Array(W).fill(false));let stack=[[1,1]];map[1][1]=0;while(stack.length){let [x,y]=stack.at(-1),options=shuffle(dirs.slice()).filter(([dx,dy])=>x+dx*2>0&&x+dx*2<W-1&&y+dy*2>0&&y+dy*2<H-1&&map[y+dy*2][x+dx*2]);if(!options.length){stack.pop();continue}let [dx,dy]=options[0];map[y+dy][x+dx]=0;map[y+dy*2][x+dx*2]=0;stack.push([x+dx*2,y+dy*2])}
for(let i=0;i<45;i++){let x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));if(map[y][x]&&((open(x-1,y)&&open(x+1,y))||(open(x,y-1)&&open(x,y+1))))map[y][x]=0}
let q=[[1,1,0]],known=new Set(['1,1']),far=q[0];for(let i=0;i<q.length;i++){let [x,y,d]=q[i];if(d>far[2])far=q[i];for(let [dx,dy] of dirs){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(open(nx,ny)&&!known.has(k)){known.add(k);q.push([nx,ny,d+1])}}}
let options=q.filter(v=>v[2]>=10&&v[2]<=16),spawn=options.length?options[Math.floor(Math.random()*options.length)]:q.at(-1);player={x:T*1.5,y:T*1.5};enemy={x:(spawn[0]+.5)*T,y:(spawn[1]+.5)*T};goal={x:(far[0]+.5)*T,y:(far[1]+.5)*T};waypoint=null;visited=0;total=q.length;ended=false;cell='';keys.clear();start=performance.now();last=start;document.getElementById('over').classList.remove('show');vision()}
function los(ax,ay,bx,by){let dx=Math.abs(bx-ax),sx=ax<bx?1:-1,dy=-Math.abs(by-ay),sy=ay<by?1:-1,e=dx+dy;while(true){if(ax===bx&&ay===by)return true;if(map[ay][ax])return false;let n=2*e;if(n>=dy){e+=dy;ax+=sx}if(n<=dx){e+=dx;ay+=sy}}}
function vision(){let px=Math.floor(player.x/T),py=Math.floor(player.y/T),k=px+','+py;if(cell===k)return;cell=k;vis=Array.from({length:H},()=>Array(W).fill(false));for(let y=Math.max(0,py-R);y<=Math.min(H-1,py+R);y++)for(let x=Math.max(0,px-R);x<=Math.min(W-1,px+R);x++)if(Math.hypot(x-px,y-py)<=R&&los(px,py,x,y)){vis[y][x]=true;if(!seen[y][x]&&!map[y][x])visited++;seen[y][x]=true}}
function blocked(x,y){return [[-12,-12],[12,-12],[-12,12],[12,12]].some(([dx,dy])=>!open(Math.floor((x+dx)/T),Math.floor((y+dy)/T)))}
function nextStep(){let sx=Math.floor(enemy.x/T),sy=Math.floor(enemy.y/T),tx=Math.floor(player.x/T),ty=Math.floor(player.y/T);if(sx===tx&&sy===ty)return {x:(sx+.5)*T,y:(sy+.5)*T};let q=[[sx,sy]],parents=new Map([[sx+','+sy,null]]);for(let i=0;i<q.length;i++){let [x,y]=q[i];if(x===tx&&y===ty)break;for(let [dx,dy] of dirs){let nx=x+dx,ny=y+dy,k=nx+','+ny;if(open(nx,ny)&&!parents.has(k)){parents.set(k,[x,y]);q.push([nx,ny])}}}let current=[tx,ty];if(!parents.has(tx+','+ty))return null;while(true){let prev=parents.get(current[0]+','+current[1]);if(!prev||prev[0]===sx&&prev[1]===sy)break;current=prev}return {x:(current[0]+.5)*T,y:(current[1]+.5)*T}}
function chase(dt){let remaining=ENEMY_SPEED*dt;for(let i=0;i<8&&remaining>0;i++){if(!waypoint)waypoint=nextStep();if(!waypoint)break;let dx=waypoint.x-enemy.x,dy=waypoint.y-enemy.y,d=Math.hypot(dx,dy);if(d<.01){waypoint=null;break}if(d<=remaining){enemy.x=waypoint.x;enemy.y=waypoint.y;remaining-=d;waypoint=null}else{enemy.x+=dx/d*remaining;enemy.y+=dy/d*remaining;remaining=0}}}
function end(win){ended=true;finish=performance.now();keys.clear();document.getElementById('portrait').src=win?good.src:bad.src;document.getElementById('title').textContent=win?'¡Encontraste al buen pelado!':'¡Te atrapó el pelado malo!';document.getElementById('result').textContent=(win?'Ganaste en ':'Sobreviviste ')+Math.floor((finish-start)/1000)+' segundos. Exploraste el '+Math.round(visited/total*100)+'% del mapa.';document.getElementById('over').classList.add('show')}
function photo(im,x,y,color){ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;ctx.fillRect(x-22,y-22,44,44);ctx.shadowBlur=0;if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.rect(x-19,y-19,38,38);ctx.clip();let scale=Math.max(38/im.naturalWidth,38/im.naturalHeight),w=im.naturalWidth*scale,h=im.naturalHeight*scale;ctx.drawImage(im,x-w/2,y-h/2,w,h);ctx.restore()}}
function frame(now){let dt=Math.min((now-last)/1000,.035);last=now;if(!ended){let dx=Number(keys.has('arrowright')||keys.has('d'))-Number(keys.has('arrowleft')||keys.has('a')),dy=Number(keys.has('arrowdown')||keys.has('s'))-Number(keys.has('arrowup')||keys.has('w')),len=Math.hypot(dx,dy)||1;dx=dx/len*PLAYER_SPEED*dt;dy=dy/len*PLAYER_SPEED*dt;if(!blocked(player.x+dx,player.y))player.x+=dx;if(!blocked(player.x,player.y+dy))player.y+=dy;vision();chase(dt);let ex=Math.floor(enemy.x/T),ey=Math.floor(enemy.y/T),px=Math.floor(player.x/T),py=Math.floor(player.y/T);if(Math.hypot(enemy.x-player.x,enemy.y-player.y)<28&&los(ex,ey,px,py))end(false);else if(Math.hypot(goal.x-player.x,goal.y-player.y)<32)end(true)}
let cx=player.x-vw/2,cy=player.y-vh/2;ctx.fillStyle='#050812';ctx.fillRect(0,0,vw,vh);for(let y=Math.max(0,Math.floor(cy/T));y<=Math.min(H-1,Math.ceil((cy+vh)/T));y++)for(let x=Math.max(0,Math.floor(cx/T));x<=Math.min(W-1,Math.ceil((cx+vw)/T));x++){if(!seen[y][x])continue;let sx=x*T-cx,sy=y*T-cy;ctx.fillStyle=map[y][x]?'#44516b':((x+y)%2?'#253146':'#202c40');ctx.fillRect(sx,sy,T+1,T+1);if(map[y][x]){ctx.fillStyle='#64728e';ctx.fillRect(sx+2,sy+2,T-4,5);ctx.strokeStyle='#303b54';ctx.strokeRect(sx+2,sy+2,T-4,T-4)}if(!vis[y][x]){ctx.fillStyle='#030612dc';ctx.fillRect(sx,sy,T+1,T+1)}else{let d=Math.hypot(x-Math.floor(player.x/T),y-Math.floor(player.y/T));ctx.fillStyle='rgba(3,6,18,'+Math.max(0,d-2)/R*.5+')';ctx.fillRect(sx,sy,T+1,T+1)}}
if(vis[Math.floor(goal.y/T)][Math.floor(goal.x/T)])photo(good,goal.x-cx,goal.y-cy,'#ffda60');if(vis[Math.floor(enemy.y/T)][Math.floor(enemy.x/T)])photo(bad,enemy.x-cx,enemy.y-cy,'#ff3e59');ctx.shadowColor='#67d7ff';ctx.shadowBlur=18;ctx.fillStyle='#67d7ff';ctx.beginPath();ctx.arc(vw/2,vh/2,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e7faff';ctx.beginPath();ctx.arc(vw/2-3,vh/2-4,4,0,Math.PI*2);ctx.fill();let nearby=Math.hypot(enemy.x-player.x,enemy.y-player.y)<T*4;hud.textContent='⏱ '+Math.floor(((ended?finish:now)-start)/1000)+' s · 🗺 '+Math.round(visited/total*100)+'%'+(nearby?' · ⚠ El malo está cerca':'')+(missing.size?' · Falta cargar: '+[...missing].join(', '):'');requestAnimationFrame(frame)}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();keys.add(k)}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>{keys.clear();last=performance.now()});document.querySelectorAll('#pad button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(b.dataset.k))});document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
